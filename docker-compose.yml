services:
  postgres:
    image: postgres:16-alpine
    container_name: messenger_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-messenger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-messenger_secret}
      POSTGRES_DB: ${POSTGRES_DB:-messenger_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-messenger} -d ${POSTGRES_DB:-messenger_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: messenger_redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: messenger_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/firebase-service-account.json:/app/firebase-service-account.json:ro
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-messenger}:${POSTGRES_PASSWORD:-messenger_secret}@postgres:5432/${POSTGRES_DB:-messenger_db}
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - FCM_SERVICE_ACCOUNT_JSON=/app/firebase-service-account.json
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_PUBLIC_ENDPOINT_URL=${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-minio_admin}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minio_secret_change_me}
      - S3_BUCKET=${MINIO_BUCKET:-attachments}
      - S3_REGION=us-east-1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: messenger_celery_worker
    command: celery -A app.workers.celery_app worker --loglevel=info --pool=solo
    volumes:
      - ./backend/app:/app/app
      - ./backend/firebase-service-account.json:/app/firebase-service-account.json:ro
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-messenger}:${POSTGRES_PASSWORD:-messenger_secret}@postgres:5432/${POSTGRES_DB:-messenger_db}
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - FCM_SERVICE_ACCOUNT_JSON=/app/firebase-service-account.json
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_PUBLIC_ENDPOINT_URL=${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-minio_admin}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minio_secret_change_me}
      - S3_BUCKET=${MINIO_BUCKET:-attachments}
      - S3_REGION=us-east-1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
        
  minio:
    image: minio/minio:latest
    container_name: messenger_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secret_change_me}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio_init:
    image: minio/mc:latest
    container_name: messenger_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secret_change_me}
      MINIO_BUCKET: ${MINIO_BUCKET:-attachments}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing local/$$MINIO_BUCKET;
      mc anonymous set download local/$$MINIO_BUCKET/thumbs || true;
      echo 'MinIO init done';
      "
    restart: "no"

  nginx:
    image: nginx:alpine
    container_name: messenger_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    command: >
      sh -c "nginx -g 'daemon off;' &
             NGINX_PID=$$!;
             while :; do sleep 6h; nginx -s reload; done &
             wait $$NGINX_PID"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  certbot:
    image: infinityofspace/certbot_dns_duckdns:latest
    container_name: messenger_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/renew.sh:/renew.sh:ro
    environment:
      - DUCKDNS_TOKEN=${DUCKDNS_TOKEN}
    entrypoint: ["/bin/sh", "/renew.sh"]
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data: